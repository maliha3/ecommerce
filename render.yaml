# Render blueprint. Commit this, then "New +" -> "Blueprint" in Render.
# Free web service: sleeps after 15 minutes idle, wakes on the next request.
services:
  - type: web
    name: threadco-shop
    runtime: python
    plan: free
    region: singapore          # closest to Bangladesh; match your Neon region
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --threads 4 --timeout 60"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true     # Render generates and stores it
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      # Paste these in the dashboard — marked sync:false so they are not in git.
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BKASH_NUMBER
        sync: false
      - key: NAGAD_NUMBER
        sync: false
      - key: SHOP_PHONE
        sync: false
      # Set to "true" for the first deploy only, to seed the catalogue.
      - key: SEED_DATA
        sync: false
      # Creates the first admin login, since the free plan has no shell.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
